# Quantumult X 配置模板(与 loon/loon-template.conf 同构,本仓库以 Loon 为基准)
#
# 策略组命名、地区正则、分流顺序全部对齐 Loon 基准模板:
#   Loon [Proxy Group] 场景组   → 本文件 [policy] 同名 static 组
#   Loon [Remote Filter] 正则   → 本文件 server-tag-regex 同一套正则
#   Loon [Remote Rule] 分流顺序 → 本文件 [filter_remote] 同序引用(同一批镜像仓规则)
#
# 使用方法:
#   1. [server_remote] 把占位 URL 换成你的机场订阅,去掉 enabled=false
#   2. [policy] 地区组用 server-tag-regex 正则筛节点,与 Loon/Clash 同一套
#   3. 远程规则统一走 shjliu911/ios-rule-script-mirror + surge-ai-lists(和 Loon 完全同源)
#
# 2026-10-30 分流审计:顶置 Lan 表(修 AdvertisingTest 内网 REJECT 击穿);ChinaMaxNoMedia 缺 microsoft.com
# 2026-11-03 修复审计:31 条 ms/cn 豁免从 [filter_remote] 移入 [filter_local](本地规则只允许写在这,原位置不生效);
#   修复 5 个地区组重名「节点节点」(被引用的单名不存在,组全部失联);hdslb.com DNS 锁定补 * 通配;
#   geoip cn 兜底由注释改为生效(与头部声明一致);google.ms/nico.ms/ntp.nat.ms/rsg.ms/sm.ms/visa.com.ms/nyti.ms 7 个非微软域豁免改指 全球代理。
#   主域→新增微软服务直连表;裸 .ms/.cn 截杀→31 条豁免;补齐 GEOIP KR/TW/CN 兜底。
# 2026-11-08 图标补齐:33 个策略组全部挂上 Qure Color 图标(此前仅 15 组有图标,其余 18 组显示默认 Σ);
#   地区组原用 IconSet 根目录的白色图标,浅色背景下几乎不可见,统一改用 IconSet/Color 彩色版。
#   图标源改为自己的 fork shjliu911/Qure(与 Koolson/Qure 同内容),不再依赖上游。
# 2026-11-08 DNS 改 DoH:全局明文 server= 换成 doh-server=(阿里 + 腾讯并发);17 条域名绑定同步改为
#   doh-server=/*.域名/https://…;QX 在设置 doh-server 后会忽略系统 DNS 与全局明文 server。
# 分流顺序(与 Loon [Remote Rule] 一一对应):
#   广告拦截 → 运营商劫持 → 国内AI → 海外AI(OpenAI/Claude/Gemini/Copilot/JetBrains/AI平台)
#   → TestFlight/苹果/私有种子(PT)/电报 → 国内垂直流媒体 → ChinaMedia
#   → YouTube/Netflix/巴哈 → Google → GlobalMedia → 微软服务直连
#   → ChinaMaxNoMedia 直连 → Global → China IP 直连兜底
#
# 结构说明:
#   [general]        KOP-XIAO 资源解析器 + ip-api 中文节点信息展示
#   [dns]            阿里/腾讯 DoH 并发查询 + 国内大厂域名锁定国内 DoH 解析
#   [policy]         场景化策略组(命名与 Loon 一致)
#   [server_remote]  机场订阅(占位)
#   [filter_remote]  远程分流(镜像仓规则,与 Loon 同序)
#   [rewrite_remote] 远程重写
#   [server_local]   自备节点(模板里无,自行添加)
#   [filter_local]   本地分流
#   [rewrite_local]  本地重写
#   [mitm]           MITM(在 QX UI 里生成证书后填入)

;general 模块内为一些通用的设置参数项
[general]
;Quantumult X 会对 server_check_url 指定的网址进行相应测试，以确认节点的可用性
server_check_url= http://www.qualcomm.cn/generate_204

;资源解析器(KOP-XIAO),用于远程订阅/规则/复写的格式转换
resource_parser_url= https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js

;geo_location_checker用于节点页面的节点信息展示(ip-api 中文)
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

;running_mode_trigger 模式切换(按需启用,SSID 换成你自己的)
;running_mode_trigger=filter, filter, asus-5g:all_direct, asus: all_proxy

;ssid_suspended_list，让 Quantumult X 在特定 Wi-Fi 网络下暂停工作
;ssid_suspended_list=Asus

;dns exclusion list中的域名将不使用fake-ip方式
;dns_exclusion_list=*.qq.com, qq.com

[dns]
;DoH:阿里 + 腾讯并发查询(逗号分隔 = 同时发出、先回的采用)
;设置 doh-server 后,QX 会忽略系统 DNS 与所有「未绑定域名」的明文 server,全局解析不再走 UDP 53
doh-server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query

;指定域名解析(国内大厂域名锁定国内 DoH,保证 CDN 就近解析;同样不走明文 DNS)
doh-server=/*.taobao.com/https://dns.alidns.com/dns-query
doh-server=/*.tmall.com/https://dns.alidns.com/dns-query
doh-server=/*.alipay.com/https://dns.alidns.com/dns-query
doh-server=/*.alicdn.com/https://dns.alidns.com/dns-query
doh-server=/*.aliyun.com/https://dns.alidns.com/dns-query
doh-server=/*.jd.com/https://doh.pub/dns-query
doh-server=/*.qq.com/https://doh.pub/dns-query
doh-server=/*.tencent.com/https://doh.pub/dns-query
doh-server=/*.weixin.com/https://doh.pub/dns-query
doh-server=/*.bilibili.com/https://doh.pub/dns-query
doh-server=/*.hdslb.com/https://doh.pub/dns-query
doh-server=/*.163.com/https://doh.pub/dns-query
doh-server=/*.126.com/https://doh.pub/dns-query
doh-server=/*.126.net/https://doh.pub/dns-query
doh-server=/*.netease.com/https://doh.pub/dns-query
doh-server=/*.mi.com/https://doh.pub/dns-query
doh-server=/*.xiaomi.com/https://doh.pub/dns-query

