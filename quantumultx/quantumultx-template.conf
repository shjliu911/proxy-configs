# Quantumult X 配置模板(与 loon/loon-template.conf 同构,本仓库以 Loon 为基准)
#
# 策略组命名、地区正则、分流顺序全部对齐 Loon 基准模板:
#   Loon [Proxy Group] 场景组   → 本文件 [policy] 同名 static 组
#   Loon [Remote Filter] 正则   → 本文件 server-tag-regex 同一套正则
#   Loon [Remote Rule] 分流顺序 → 本文件 [filter_remote] 同序引用(同一批镜像仓规则)
#
# 使用方法:
#   1. [server_remote] 把占位 URL 换成你的机场订阅,去掉 enabled=false
#   2. [policy] 地区组用 server-tag-regex 正则筛节点,与 Loon/Clash 同一套
#   3. 远程规则统一走 shjliu911/ios-rule-script-mirror + surge-ai-lists(和 Loon 完全同源)
#
# 2026-10-30 分流审计:顶置 Lan 表(修 AdvertisingTest 内网 REJECT 击穿);ChinaMaxNoMedia 缺 microsoft.com
#   主域→新增微软服务直连表;裸 .ms/.cn 截杀→31 条豁免;补齐 GEOIP KR/TW/CN 兜底。
# 分流顺序(与 Loon [Remote Rule] 一一对应):
#   去广告 → 劫持 → 国内AI直连 → 海外AI → TestFlight/苹果/PT/电报
#   → 国内垂直流媒体 → ChinaMedia → YouTube/Netflix/巴哈 → Google → GlobalMedia
#   → ChinaMaxNoMedia 直连 → Global → China IP 直连兜底
#
# 结构说明:
#   [general]        KOP-XIAO 资源解析器 + ip-api 中文节点信息展示
#   [dns]            阿里/腾讯 DoH 对应的明文 DNS + 国内大厂域名指定解析
#   [policy]         场景化策略组(命名与 Loon 一致)
#   [server_remote]  机场订阅(占位)
#   [filter_remote]  远程分流(镜像仓规则,与 Loon 同序)
#   [rewrite_remote] 远程重写
#   [server_local]   自备节点(模板里无,自行添加)
#   [filter_local]   本地分流
#   [rewrite_local]  本地重写
#   [mitm]           MITM(在 QX UI 里生成证书后填入)

;general 模块内为一些通用的设置参数项
[general]
;Quantumult X 会对 server_check_url 指定的网址进行相应测试，以确认节点的可用性
server_check_url= http://www.qualcomm.cn/generate_204

;资源解析器(KOP-XIAO),用于远程订阅/规则/复写的格式转换
resource_parser_url= https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js

;geo_location_checker用于节点页面的节点信息展示(ip-api 中文)
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

;running_mode_trigger 模式切换(按需启用,SSID 换成你自己的)
;running_mode_trigger=filter, filter, asus-5g:all_direct, asus: all_proxy

;ssid_suspended_list，让 Quantumult X 在特定 Wi-Fi 网络下暂停工作
;ssid_suspended_list=Asus

;dns exclusion list中的域名将不使用fake-ip方式
;dns_exclusion_list=*.qq.com, qq.com

