# ---------- 分流规则(顺序 = Loon [Remote Rule] 一一对应) ----------
rules:
  # 本地自定义(与 Loon [Rule] 对应,特例按需增删)
  - DOMAIN-SUFFIX,zwift.com,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ── 1. 去广告(与 Loon 一号位相同,直接 REJECT) ──
  - RULE-SET,advertising,REJECT
  - RULE-SET,hijacking,REJECT

  # ── 2. AI(国内直连最先压过海外表;海外全部汇入「AI平台」) ──
  - RULE-SET,ai-cn,DIRECT
  - RULE-SET,ai-openai,AI平台
  - RULE-SET,ai-claude,AI平台
  - RULE-SET,ai-gemini,AI平台
  - RULE-SET,ai-copilot,AI平台
  - RULE-SET,ai-jetbrains,AI平台
  - RULE-SET,ai-others,AI平台

  # ── 3. 特定应用与独立生态 ──
  - RULE-SET,testflight,Testflight
  - RULE-SET,apple,苹果服务
  - RULE-SET,privatetracker,国内直连
  - RULE-SET,telegram,电报消息

  # ── 国内垂直流媒体(必须排在 ChinaMedia 综合大包前) ──
  - RULE-SET,netease-music,网易音乐
  - RULE-SET,bilibili,哔哩哔哩
  - RULE-SET,tencent-video,腾讯视频
  - RULE-SET,iqiyi,爱奇艺
  - RULE-SET,china-media,国内视频

  # ── 国外独立流媒体(必须排在 GlobalMedia 前) ──
  - RULE-SET,youtube,油管视频
  - RULE-SET,netflix,奈飞视频
  - RULE-SET,bahamut,巴哈姆特

  # ── Google 全家桶(YouTube 之后、GlobalMedia 之前) ──
  - RULE-SET,google,谷歌服务
  - RULE-SET,google-supplement,谷歌服务

  # ── 国外泛媒体兜底(Disney+/HBO/Hulu 等) ──
  - RULE-SET,global-media,国外媒体

  # ── 兜底大列表:国内直连必须在全球代理之前! ──
  - RULE-SET,chinamax-nomedia,国内直连
  - RULE-SET,global,全球代理

  # GeoIP 兜底(与 Loon [Rule] 一致)
  - GEOIP,KR,韩国节点
  - GEOIP,TW,台湾节点
  - GEOIP,CN,DIRECT

  # 最终兜底
  - MATCH,FINAL
