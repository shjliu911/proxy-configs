# Clash / OpenClash 配置模板(与 loon/loon-template.conf 同构,本仓库以 Loon 为基准)
#
# 适用:mihomo/Clash Meta 内核 —— OpenClash(OpenWrt)、Clash Verge Rev 等
# 策略组命名、地区正则、分流顺序全部对齐 Loon 基准模板:
#   Loon [Proxy Group] 场景组   → 本文件 proxy-groups 同名组
#   Loon [Remote Filter] 正则   → 本文件 地区组 filter 同一套正则(url-test 自动选优)
#   Loon [Remote Rule] 分流顺序 → 本文件 rule-providers + rules 同序引用(同一批镜像仓规则)
#
# 使用方法:
#   1. proxy-providers 的 url 换成你的机场订阅(支持 v2ray/clash 格式)
#   2. OpenClash:配置文件管理里上传,或在「第三方订阅转换」里引用 raw 链接
#   3. 分流顺序(与 Loon [Remote Rule] 一一对应):
#      去广告 → 国内AI直连 → 海外AI → TestFlight/苹果/PT/电报 → 国内垂直流媒体
#      → ChinaMedia → YouTube/Netflix/巴哈 → Google → GlobalMedia
#      → ChinaMaxNoMedia 直连 → Global 走全球代理

mode: rule
log-level: warning
ipv6: false
allow-lan: false
external-controller: 127.0.0.1:9090   # OpenWrt 上按需改 0.0.0.0:9090

# ---------- DNS(fake-ip 模式,Meta 内核;real-ip 白名单与 Loon 一致) ----------
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '+.xboxlive.com'
    - '+.battlenet.com.cn'
    - '+.battlenet.com'
    - '+.blzstatic.cn'
    - '+.battle.net'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ---------- 机场订阅(替换成你自己的) ----------
proxy-providers:
  airport:
    type: http
    url: "https://YOUR-AIRPORT-SUBSCRIPTION-URL/path"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300

# ---------- 策略组(命名与 Loon [Proxy Group] 一致) ----------
proxy-groups:
  # 主入口
  - name: FINAL
    type: select
    proxies:
      - 全球代理
      - 节点选择

  - name: 节点选择
    type: select
    proxies:
      - 香港节点
      - 狮城节点
      - 美国节点
      - 韩国节点
      - 日本节点
      - 台湾节点
    use:
      - airport

  - name: 全球代理
    type: select
    proxies:
      - 节点选择
      - 美国节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 台湾节点
      - 香港节点
    use:
      - airport

  # 场景组(与 Loon 同名同序的候选地区)
  - name: AI平台
    type: select
    proxies:
      - 美国节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 台湾节点
      - 香港节点
      - 节点选择

  - name: 谷歌服务
    type: select
    proxies:
      - 美国节点
      - 狮城节点
      - 台湾节点
      - 香港节点
      - 日本节点

  - name: 电报消息
    type: select
    proxies:
      - 香港节点
      - 狮城节点
      - 美国节点

  - name: 国外媒体
    type: select
    proxies:
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 韩国节点
      - 美国节点

  - name: 油管视频
    type: select
    proxies:
      - 香港节点
      - 狮城节点
      - 韩国节点
      - 美国节点

  - name: 奈飞视频
    type: select
    proxies:
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 美国节点

  - name: 巴哈姆特
    type: select
    proxies:
      - 台湾节点

  - name: 哔哩哔哩
    type: select
    proxies:
      - 国内视频
      - 台湾节点
      - 香港节点

  - name: 爱奇艺
    type: select
    proxies:
      - 国内视频
      - 台湾节点
      - 香港节点

  - name: 腾讯视频
    type: select
    proxies:
      - 国内视频
      - 香港节点
      - 台湾节点

  - name: 网易音乐
    type: select
    proxies:
      - DIRECT

  - name: 国内视频
    type: select
    proxies:
      - DIRECT

  - name: 国内直连
    type: select
    proxies:
      - DIRECT

  - name: Testflight
    type: select
    proxies:
      - DIRECT
      - 节点选择

  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择

  # ----- 地区组:url-test 自动选优,filter 正则 = Loon [Remote Filter] 同一套 -----
  - name: 香港节点
    type: url-test
    use:
      - airport
    filter: "(?i)(港|HK|Hong)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 台湾节点
    type: url-test
    use:
      - airport
    filter: "(?i)(台|TW|Tai)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 日本节点
    type: url-test
    use:
      - airport
    filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 韩国节点
    type: url-test
    use:
      - airport
    filter: "(?i)(KR|Korea|KOR|首尔|韩|韓)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 美国节点
    type: url-test
    use:
      - airport
    filter: "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 狮城节点
    type: url-test
    use:
      - airport
    filter: "(?i)(新加坡|坡|狮城|SG|Singapore)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

