    proxies:
      - 🎞️ 国内视频
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点

  - name: 🎵 网易音乐
    type: select
    proxies:
      - DIRECT

  - name: 🎞️ 国内视频
    type: select
    proxies:
      - DIRECT

  - name: 🈯 国内直连
    type: select
    proxies:
      - DIRECT

  - name: 🪟 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: ✈️ Testflight
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  # ----- 地区组:url-test 自动选优,filter 正则 = Loon [Remote Filter] 同一套 -----
  - name: 🇭🇰 香港节点
    type: url-test
    use:
      - airport
    filter: "(?i)(港|HK|Hong)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇹🇼 台湾节点
    type: url-test
    use:
      - airport
    filter: "(?i)(台|TW|Tai)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 日本节点
    type: url-test
    use:
      - airport
    filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇰🇷 韩国节点
    type: url-test
    use:
      - airport
    filter: "(?i)(KR|Korea|KOR|首尔|韩|韓)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇺🇸 美国节点
    type: url-test
    use:
      - airport
    filter: "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 狮城节点
    type: url-test
    use:
      - airport
    filter: "(?i)(新加坡|坡|狮城|SG|Singapore)"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

