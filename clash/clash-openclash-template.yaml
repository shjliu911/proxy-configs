# ---------- 分流规则(顺序 = Loon [Remote Rule] 一一对应) ----------
rules:
  # 本地自定义(与 Loon [Rule] 对应,特例按需增删)
  - DOMAIN-SUFFIX,zwift.com,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ── 0.9 广告表误杀豁免(上游 Advertising_Domain.yaml 误收的正常服务域,按下游命中表的目标组放行) ──
  - DOMAIN-SUFFIX,api.iplay.163.com,🎵 网易音乐
  - DOMAIN-SUFFIX,mam.netease.com,🎵 网易音乐
  - DOMAIN-SUFFIX,pgdt.gtimg.cn,🐧 腾讯视频
  - DOMAIN-SUFFIX,71.am,🥝 爱奇艺
  - DOMAIN-SUFFIX,4paradigm.com,DIRECT
  - DOMAIN-SUFFIX,gvt2.com,▶️ 油管视频
  - DOMAIN-SUFFIX,ggpht.cn,▶️ 油管视频
  - DOMAIN-SUFFIX,cookielaw.org,🎥 奈飞视频
  - DOMAIN-SUFFIX,onetrust.com,🎥 奈飞视频

  # ── 1. 去广告(拦截策略组，默认 REJECT，误杀时可切 DIRECT) ──
  - RULE-SET,advertising,🛑 广告拦截
  - RULE-SET,hijacking,🛑 广告拦截

  # ── 2. AI(国内直连最先压过海外表；海外细分各品牌独立策略组) ──
  - RULE-SET,ai-cn,🧠 国内AI
  - RULE-SET,ai-openai,🤖 OpenAI
  - RULE-SET,ai-claude,💬 Claude
  - RULE-SET,ai-gemini,✨ Gemini
  - RULE-SET,ai-copilot,🐙 Copilot
  - RULE-SET,ai-jetbrains,💻 JetBrains
  - RULE-SET,ai-others,🚦 AI平台

  # ── 3. 特定应用与独立生态 ──
  - RULE-SET,testflight,✈️ Testflight
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,privatetracker,📥 私有种子
  - RULE-SET,telegram,📲 电报消息

  # ── 国内垂直流媒体(必须排在 ChinaMedia 综合大包前) ──
  - RULE-SET,netease-music,🎵 网易音乐
  - RULE-SET,bilibili,📺 哔哩哔哩
  - RULE-SET,tencent-video,🐧 腾讯视频
  - RULE-SET,youku,🍿 优酷视频
  - RULE-SET,iqiyi,🥝 爱奇艺
  - RULE-SET,china-media,🎞️ 国内视频

  # ── 国外独立流媒体(必须排在 GlobalMedia 前) ──
