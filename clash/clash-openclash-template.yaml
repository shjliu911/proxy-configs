      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点

  - name: 🐉 巴哈姆特
    type: select
    proxies:
      - 🇹🇼 台湾节点

  - name: 📺 哔哩哔哩
    type: select
    proxies:
      - 🎞️ 国内视频
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点

  - name: 🥝 爱奇艺
    type: select
    proxies:
      - 🎞️ 国内视频
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点

  - name: 🍿 优酷视频
    type: select
    proxies:
      - 🎞️ 国内视频
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点

  - name: 🐧 腾讯视频
