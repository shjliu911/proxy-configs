# Clash / OpenClash 配置模板(与 loon/loon-template.conf 同构,本仓库以 Loon 为基准)
#
# 适用:mihomo/Clash Meta 内核 —— OpenClash(OpenWrt)、Clash Verge Rev 等
# 策略组命名、地区正则、分流顺序全部对齐 Loon 基准模板:
#   Loon [Proxy Group] 场景组   → 本文件 proxy-groups 同名组
#   Loon [Remote Filter] 正则   → 本文件 地区组 filter 同一套正则(url-test 自动选优)
#   Loon [Remote Rule] 分流顺序 → 本文件 rule-providers + rules 同序引用(同一批镜像仓规则)
#
# 使用方法:
#   1. proxy-providers 的 url 换成你的机场订阅(支持 v2ray/clash 格式)
#   2. OpenClash:配置文件管理里上传,或在「第三方订阅转换」里引用 raw 链接
#   3. 分流顺序(与 Loon [Remote Rule] 一一对应):
#      (2026-10-30 审计补丁:微软服务直连表、.ms/.cn 裸后缀豁免、广告表误杀 9 条豁免)
#      去广告 → 国内AI直连 → 海外AI → TestFlight/苹果/PT/电报 → 国内垂直流媒体
#      → ChinaMedia → YouTube/Netflix/巴哈 → Google → GlobalMedia
#      → ChinaMaxNoMedia 直连 → Global 走全球代理

mode: rule
log-level: warning
ipv6: false
allow-lan: false
external-controller: 127.0.0.1:9090   # OpenWrt 上按需改 0.0.0.0:9090

# ---------- DNS(fake-ip 模式,Meta 内核;real-ip 白名单与 Loon 一致) ----------
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '+.xboxlive.com'
    - '+.battlenet.com.cn'
    - '+.battlenet.com'
    - '+.blzstatic.cn'
    - '+.battle.net'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ---------- 机场订阅(替换成你自己的) ----------
proxy-providers:
  airport:
    type: http
    url: "https://YOUR-AIRPORT-SUBSCRIPTION-URL/path"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300

# ---------- 策略组(命名与 Loon [Proxy Group] 一致) ----------
proxy-groups:
  # 主入口
  - name: 🎯 FINAL
    type: select
    proxies:
      - 🌍 全球代理
      - 🚀 节点选择

  - name: 🚀 节点选择
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
    use:
      - airport

  - name: 🌍 全球代理
    type: select
    proxies:
      - 🚀 节点选择
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点
    use:
      - airport

  # 基础控制与安全组
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 📥 私有种子
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  # AI 专属服务组(各品牌独立分流)
  - name: 🧠 国内AI
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🤖 OpenAI
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🚀 节点选择

  - name: 💬 Claude
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🚀 节点选择

  - name: ✨ Gemini
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🚀 节点选择

  - name: 🐙 Copilot
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🚀 节点选择

  - name: 💻 JetBrains
    type: select
    proxies:
      - 🚀 节点选择
      - 🌍 全球代理
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点

  - name: 🚦 AI平台
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点
      - 🚀 节点选择

  - name: 🔎 谷歌服务
    type: select
    proxies:
      - 🇺🇸 美国节点
      - 🇸🇬 狮城节点
      - 🇹🇼 台湾节点
