    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇺🇸 美国节点

  - name: 🎬 国外媒体
    type: select
    proxies:
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
