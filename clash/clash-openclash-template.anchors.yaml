  youku: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/Youku/Youku.yaml", path: "./rules/youku.yaml"}
  iqiyi: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/iQIYI/iQIYI.yaml", path: "./rules/iqiyi.yaml"}
