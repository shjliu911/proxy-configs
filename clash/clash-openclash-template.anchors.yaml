# Clash / OpenClash 配置模板(与 loon/loon-template.conf 同构,本仓库以 Loon 为基准)
#
# 适用:mihomo/Clash Meta 内核 —— OpenClash(OpenWrt)、Clash Verge Rev 等
# 策略组命名、地区正则、分流顺序全部对齐 Loon 基准模板:
#   Loon [Proxy Group] 场景组   → 本文件 proxy-groups 同名组
#   Loon [Remote Filter] 正则   → 本文件 地区组 filter 同一套正则(手动选择节点)
#   Loon [Remote Rule] 分流顺序 → 本文件 rule-providers + rules 同序引用(同一批镜像仓规则)
#
# 使用方法:
#   1. proxy-providers 的 url 换成你的机场订阅(支持 v2ray/clash 格式)
#   2. OpenClash:配置文件管理里上传,或在「第三方订阅转换」里引用 raw 链接
#   3. 分流顺序(与 Loon [Remote Rule] 一一对应):
#
# 2026-11-09 代码审计回退与优化 (基于内核源码审计):
#   - 【回退 P0】GEOIP,private 实际为死规则（mihomo 内核仅特判 GEOIP,lan 且不含 100.64 CGNAT），
#     回退为显式完整 IP-CIDR / IP-CIDR6 列表，杜绝局域网与 Tailscale 漏入代理
#   - 【调整 P2】sniffer 嗅探关闭 parse-pure-ip 降低软路由 CPU 负载，清理无效跳过项，标注 OpenClash 接管机制
#   - 保留 rule-providers 的 `proxy: 🚀 节点选择`（解决 raw.github 封锁）及 geox-url 的 fastly 镜像
#
# 2026-11-09 DNS 优化修复 (方案 A: Fake-IP 纯净远端解析模式):
#   - 修复 OpenClash 脚本分词 Bug: 彻底移除 nameserver-policy 中的 `https://1.1.1.1/dns-query#🚀 节点选择`。
#     因空格分词导致“节点选择”被当作独立域名向 223.5.5.5 查询报 NXDOMAIN，且代理组匹配失败引发境外 DNS 全死。
#   - 践行 Fake-IP 核心原则: 境外域名全部由远端代理节点解析，本地零解析零污染零延迟，彻底杜绝鸡生蛋死锁。
#   - 强化 fake-ip-filter: 补充常见 NTP、STUN 域名，确保局域网与校时协议直连精准。
#   - GEOIP,CN 补充 no-resolve: 防止未命中规则的境外域名被反向触发国内 DNS 解析。
#   - 新增 find-process-mode / unified-delay / tcp-concurrent / keep-alive / profile 持久化
#   - proxy-providers 显式 proxy: DIRECT + User-Agent + health-check(expected-status)
#   - geox-url 补 geoip/geosite 的 jsdelivr 镜像
#
# 2026-11-03 修复审计:google.ms/nico.ms/ntp.nat.ms/rsg.ms/sm.ms/visa.com.ms/nyti.ms 7 个非微软域豁免改指 全球代理
#      (原指 微软服务[DIRECT 默认],与豁免目的矛盾);美国组 filter 正则加词边界(RUS/AUS 不再误入);修正过时行号 3155→3177。
#      (2026-10-30 审计补丁:微软服务直连表、.ms/.cn 裸后缀豁免、广告表误杀 9 条豁免)
#      去广告 → 国内AI直连 → 海外AI → TestFlight/苹果/PT/电报 → 国内垂直流媒体
#      → ChinaMedia → YouTube/Netflix/巴哈 → Google → GlobalMedia
#      → ChinaMaxNoMedia 直连 → Global 走全球代理

mode: rule
log-level: warning
ipv6: false
allow-lan: false
external-controller: 127.0.0.1:9090   # OpenWrt 上按需改 0.0.0.0:9090

# ---------- 内核行为（对齐 mihomo 官方 docs/config.yaml） ---------
# 统一延迟测量口径 + TCP 并发握手取最快
unified-delay: true
tcp-concurrent: true
# 长连接保活（秒）
keep-alive-interval: 15
keep-alive-idle: 600
# 记住手动选择的节点与 fake-ip 映射，重启不丢
profile:
  store-selected: true
  store-fake-ip: true

# ---------- GEO 数据库与自动更新(对齐官方 geox-url) ---------
geodata-mode: false
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
  asn: "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

geo-auto-update: false # 是否自动更新 geodata
geo-update-interval: 24 # 更新间隔，单位：小时

# ---------- 流量与域名嗅探 (对 Verge Rev / FlClash 生效；OpenClash 会由其 UCI 嗅探配置接管) ---------
sniffer:
  enable: true
  parse-pure-ip: false # 路由器场景保持 false，节约 CPU 开销
  override-destination: false
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  skip-domain:
    - "+.push.apple.com"

# ---------- DNS(fake-ip,对齐 mihomo 官方与 OpenClash 最佳实践) ----------
# 要点:
# 1. DIRECT 独立解析器(direct-nameserver): 避免 provider 拉取及直连解析被海外 DoH 拖超时
# 2. proxy-server-nameserver: 专门直连解析机场节点域名，绝不走代理，破除鸡生蛋死锁
# 3. fake-ip 纯净模式: 境外域名完全由远端代理节点解析，本地返回 fake-ip 即可，无需在本地跨代理查询 1.1.1.1
# 4. 严禁在 URL 后缀 (#) 中包含空格与 Emoji（如 #🚀 节点选择），OpenClash 脚本分词会将其切开，
#    导致“节点选择”被当作独立域名向 223.5.5.5 查询引发 NXDOMAIN，且代理组匹配失败导致境外 DNS 全死。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-ttl: 1
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.windows.com'
    - 'pool.ntp.org'
    - '+.pool.ntp.org'
    - 'stun.*'
    - '+.stun.*'
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '+.xboxlive.com'
    - '+.battlenet.com.cn'
    - '+.battlenet.com'
    - '+.blzstatic.cn'
    - '+.battle.net'
  # 仅用于解析 DNS 服务器自身的域名,必须是纯 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 主 DNS: 国内 DoH, 保证大陆域名解析精准
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 节点(机场)域名解析: 走国内明文 DNS, 避免 DoH 自举循环
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # DIRECT 出口解析: 与 DoH/fallback 解耦, 防止直连解析被墙拖死
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
  # 内网及局域网保留域名策略解析
  nameserver-policy:
    'geosite:private':
      - 223.5.5.5
      - 119.29.29.29
  # DNS 上游连接遵循 rules(官方要求 proxy-server-nameserver 非空)
  respect-rules: true
  use-hosts: true

# ── 锚点定义区(顶层键仅供 YAML 引用,mihomo 会忽略) ─────────────

# 订阅提供者基础参数;每个 provider 必须单独覆盖 path
p: &p
  type: http
  interval: 86400
  path: ./providers/airport.yaml
  # 订阅拉取走直连(依赖上面的 dns.direct-nameserver)。
  # 若机场/转换站域名直连被墙,可改 proxy: 🚀 节点选择(需已有可用节点,注意鸡生蛋)
  proxy: DIRECT
  # 部分机场按 UA 下发不同格式,显式声明 Clash UA
  header:
    User-Agent:
      - "Clash/v1.18.0"
      - "mihomo/1.18.3"
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 600
    lazy: true

use-airport: &airport-ref
  - airport

# 地区节点筛选正则(与 Loon [Remote Filter] 同一套)
FilterHK: &FilterHK "(?i)(港|HK|Hong)"
FilterTW: &FilterTW "(?i)(台|TW|Tai)"
FilterJP: &FilterJP "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"
FilterKR: &FilterKR "(?i)(KR|Korea|KOR|首尔|韩|韓)"
FilterUS: &FilterUS "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?:US|United States)(?![a-zA-Z]))"
FilterSG: &FilterSG "(?i)(新加坡|坡|狮城|SG|Singapore)"

# 地区手动选择组基础参数;配合 filter 只列出该地区节点
g_manual: &g_manual
  type: select
  use: *airport-ref

# 功能组候选列表锚点(TheFullSmart 风格:不同锚点表达不同优先级)
SelectFinal: &SelectFinal {type: select, proxies: [🌍 全球代理, 🚀 节点选择]}
SelectMain: &SelectMain {type: select, proxies: [🇭🇰 香港节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 🇰🇷 韩国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点], use: *airport-ref}
SelectGlobal: &SelectGlobal {type: select, proxies: [🚀 节点选择, 🇺🇸 美国节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇹🇼 台湾节点, 🇭🇰 香港节点], use: *airport-ref}
SelectAdBlock: &SelectAdBlock {type: select, proxies: [REJECT, DIRECT]}
SelectAI: &SelectAI {type: select, proxies: [🇺🇸 美国节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇹🇼 台湾节点, 🇭🇰 香港节点, 🚀 节点选择]}
SelectAIBrand: &SelectAIBrand {type: select, proxies: [🇺🇸 美国节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇹🇼 台湾节点, 🚀 节点选择]}
SelectJetBrains: &SelectJetBrains {type: select, proxies: [🚀 节点选择, 🌍 全球代理, 🇺🇸 美国节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇹🇼 台湾节点]}
SelectGoogle: &SelectGoogle {type: select, proxies: [🇺🇸 美国节点, 🇸🇬 狮城节点, 🇹🇼 台湾节点, 🇭🇰 香港节点, 🇯🇵 日本节点]}
SelectTelegram: &SelectTelegram {type: select, proxies: [🇭🇰 香港节点, 🇸🇬 狮城节点, 🇺🇸 美国节点]}
SelectForeignMedia: &SelectForeignMedia {type: select, proxies: [🇸🇬 狮城节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🇺🇸 美国节点]}
SelectYouTube: &SelectYouTube {type: select, proxies: [🇭🇰 香港节点, 🇸🇬 狮城节点, 🇰🇷 韩国节点, 🇺🇸 美国节点]}
SelectNetflix: &SelectNetflix {type: select, proxies: [🇸🇬 狮城节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇺🇸 美国节点]}
SelectBahamut: &SelectBahamut {type: select, proxies: [🇹🇼 台湾节点]}
SelectCNVideo: &SelectCNVideo {type: select, proxies: [🎞️ 国内视频, 🇹🇼 台湾节点, 🇭🇰 香港节点]}
SelectTencentVideo: &SelectTencentVideo {type: select, proxies: [🎞️ 国内视频, 🇭🇰 香港节点, 🇹🇼 台湾节点]}
SelectDirect: &SelectDirect {type: select, proxies: [DIRECT]}
SelectDirectNode: &SelectDirectNode {type: select, proxies: [DIRECT, 🚀 节点选择]}

# 规则提供者基础参数
# 规则提供者基础参数(proxy: 🚀 节点选择 确保国内能拉取 GitHub Raw 上的规则)
rp_domain: &rp_domain {type: http, behavior: domain, format: yaml, interval: 86400, proxy: 🚀 节点选择}
rp_classical: &rp_classical {type: http, behavior: classical, format: yaml, interval: 86400, proxy: 🚀 节点选择}

# ---------- 机场订阅(替换成你自己的) ----------
proxy-providers:
  airport:
    <<: *p
    url: "https://YOUR-AIRPORT-SUBSCRIPTION-URL/path"
    path: ./providers/airport.yaml

# ---------- 策略组(命名与 Loon [Proxy Group] 一致) ----------
proxy-groups:
  # 主入口
  - {name: 🎯 FINAL, <<: *SelectFinal}
  - {name: 🚀 节点选择, <<: *SelectMain}
  - {name: 🌍 全球代理, <<: *SelectGlobal}

  # 基础控制与安全组
  - {name: 🛑 广告拦截, <<: *SelectAdBlock}
  - {name: 📥 私有种子, <<: *SelectDirectNode}

  # AI 专属服务组(各品牌独立分流)
  - {name: 🧠 国内AI, <<: *SelectDirectNode}
  - {name: 🤖 OpenAI, <<: *SelectAIBrand}
  - {name: 💬 Claude, <<: *SelectAIBrand}
  - {name: ✨ Gemini, <<: *SelectAIBrand}
  - {name: 🐙 Copilot, <<: *SelectAIBrand}
  - {name: 💻 JetBrains, <<: *SelectJetBrains}
  - {name: 🚦 AI平台, <<: *SelectAI}

  # 平台与应用生态组
  - {name: ✈️ Testflight, <<: *SelectDirectNode}
  - {name: 🍎 苹果服务, <<: *SelectDirectNode}
  - {name: 🪟 微软服务, <<: *SelectDirectNode}
  - {name: 🔎 谷歌服务, <<: *SelectGoogle}
  - {name: 📲 电报消息, <<: *SelectTelegram}

  # 垂直流媒体组
  - {name: 📺 哔哩哔哩, <<: *SelectCNVideo}
  - {name: 🥝 爱奇艺, <<: *SelectCNVideo}
  - {name: 🐧 腾讯视频, <<: *SelectTencentVideo}
  - {name: 🍿 优酷视频, <<: *SelectTencentVideo}
  - {name: 🎵 网易音乐, <<: *SelectDirect}
  - {name: ▶️ 油管视频, <<: *SelectYouTube}
  - {name: 🎥 奈飞视频, <<: *SelectNetflix}
  - {name: 🐉 巴哈姆特, <<: *SelectBahamut}

  # 综合大包组
  - {name: 🎞️ 国内视频, <<: *SelectDirect}
  - {name: 🎬 国外媒体, <<: *SelectForeignMedia}
  - {name: 🈯 国内直连, <<: *SelectDirect}

  # ----- 地区组:手动选择该地区节点 -----
  - {name: 🇭🇰 香港节点, <<: *g_manual, filter: *FilterHK}
  - {name: 🇹🇼 台湾节点, <<: *g_manual, filter: *FilterTW}
  - {name: 🇯🇵 日本节点, <<: *g_manual, filter: *FilterJP}
  - {name: 🇰🇷 韩国节点, <<: *g_manual, filter: *FilterKR}
  - {name: 🇺🇸 美国节点, <<: *g_manual, filter: *FilterUS}
  - {name: 🇸🇬 狮城节点, <<: *g_manual, filter: *FilterSG}

# ---------- 规则集(镜像仓 + surge-ai-lists,与 Loon [Remote Rule] 同一批) ----------
rule-providers:
  advertising: {<<: *rp_domain, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/Advertising/Advertising_Domain.yaml", path: "./rules/advertising.yaml"}
  # 广告表误杀豁免：必须在 advertising 之前引用（独立小表，策略不同）
  advertising-exempt-ms: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/AdvertisingExempt/AdvertisingExempt-Microsoft.yaml", path: "./rules/advertising-exempt-ms.yaml"}
  advertising-exempt-global: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/AdvertisingExempt/AdvertisingExempt-Global.yaml", path: "./rules/advertising-exempt-global.yaml"}
  hijacking: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/Hijacking/Hijacking.yaml", path: "./rules/hijacking.yaml"}
  ai-cn: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-CN.yaml", path: "./rules/ai-cn.yaml"}
  ai-openai: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-OpenAI.yaml", path: "./rules/ai-openai.yaml"}
  ai-claude: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-Claude.yaml", path: "./rules/ai-claude.yaml"}
  ai-gemini: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-Gemini.yaml", path: "./rules/ai-gemini.yaml"}
  ai-copilot: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-Copilot.yaml", path: "./rules/ai-copilot.yaml"}
  ai-jetbrains: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-Jetbrains.yaml", path: "./rules/ai-jetbrains.yaml"}
  ai-others: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/surge-ai-lists/main/clash/AI-Overseas-Others.yaml", path: "./rules/ai-others.yaml"}
  testflight: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/TestFlight/TestFlight.yaml", path: "./rules/testflight.yaml"}
  apple: {<<: *rp_domain, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/Apple/Apple_Domain.yaml", path: "./rules/apple.yaml"}
  privatetracker: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/PrivateTracker/PrivateTracker.yaml", path: "./rules/privatetracker.yaml"}
  telegram: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/Telegram/Telegram.yaml", path: "./rules/telegram.yaml"}
  netease-music: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/NetEaseMusic/NetEaseMusic.yaml", path: "./rules/netease-music.yaml"}
  bilibili: {<<: *rp_classical, url: "https://raw.githubusercontent.com/shjliu911/ios-rule-script-mirror/main/rule-no-keyword/Clash/BiliBili/BiliBili.yaml", path: "./rules/bilibili.yaml"}
